    #               timeout: 86400
    #               resume_form:
    #                 schema:
    #                   type: object
    #                   properties:
    #                     comment: {type: string}
    #             value:
    #               type: rawscript
    #               language: bun
    #               content: "!inline ask_approval.ts"
    #               input_transforms:
    #                 summary: {type: javascript, expr: "results.transform.summary"}
    #     default: []
    ## Call another flow (Tines send to story). The inputs are the Tines payload keys.
    # - id: call_other_flow
    #   value:
    #     type: flow
    #     path: f/my_folder/other_flow
    #     input_transforms:
    #       item_id: {type: javascript, expr: "flow_input.item_id"}
    ## Send an email. The smtp resource is passed as a static "$res:<path>".
    # - id: send_email
    #   value:
    #     type: rawscript
    #     language: bun
    #     content: "!inline send_email.ts"
    #     input_transforms:
    #       smtp: {type: static, value: "$res:f/my_folder/smtp"}
    #       to: {type: javascript, expr: "flow_input.recipients"}
    #       subject: {type: javascript, expr: "results.transform.summary"}
    #       summary: {type: javascript, expr: "results.transform.summary"}
    ## State write at the end, after the work succeeded. Same variable as state_read.
    # - id: state_write
    #   value:
    #     type: rawscript
    #     language: bun
    #     content: "!inline state_write.ts"
    #     input_transforms:
    #       state_var: {type: static, value: f/my_folder/my_flow_state}
